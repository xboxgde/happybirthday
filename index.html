<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생일 선물 상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!-- [수정] <style> 블록 삭제 → style.css 파일로 분리 -->
<!-- [수정] ?v=3 추가: 브라우저가 예전 style.css를 재사용하지 않도록 (파일 수정 때마다 숫자를 올리면 됨) -->
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header>
  <!-- [수정] 왼쪽 상단 이모지·문구 삭제 -->
  <!-- 요구사항 1.1: 오른쪽 상단 개발자 화면 접속 버튼 -->
  <button class="btn sub" id="btnDev">개발자</button>
</header>

<main>

  <!-- [1] 첫 화면: 생일인지 아닌지 선택 -->
  <section class="view on" id="v-home">
    <h1>생일인가용</h1>
    <div class="row">
      <button class="btn" id="btnYes">생일인데용</button>
      <button class="btn mint" id="btnNo">생일아닌데용</button>
    </div>
  </section>

  <!-- [2] 생일 입력 화면 -->
  <section class="view" id="v-input">
    <h2>생일이 언제인뎁숑</h2>
    <div class="panel">
      <label>월 / 일</label>
      <div class="inline">
        <select id="selMonth" aria-label="월"></select>
        <select id="selDay" aria-label="일"></select>
      </div>
      <p class="msg" id="inputMsg" role="alert"></p>
      <div class="row"><button class="btn" id="btnCheck">생일 확인하기</button>
      <button class="btn sub" data-go="home">처음으로</button></div>
    </div>
  </section>

  <!-- [3] 생일이 아닐 때 화면 -->
  <section class="view" id="v-notbday">
    <h1>생일이 아니잖아.</h1>
    <p>생일이 되면 다시와라.</p>
    <!-- [추가] 개발자가 등록한 사진 (등록 전에는 숨김) -->
    <img class="gift" id="notbdayImg" alt="" style="display:none;margin-top:18px">
    <div class="row"><button class="btn" data-go="home">처음으로</button></div>
  </section>

  <!-- [수정] 동일 생일자가 2명 이상일 때 본인을 고르는 화면 추가 -->
  <section class="view" id="v-pick">
    <h2>똑같은 생일이 여러명이군.</h2>
    <p>다른사람 고르면 집까지 찾아감.</p>
    <div class="pickList" id="pickList"></div>
    <div class="row"><button class="btn sub" data-go="input">다시 입력</button></div>
  </section>

  <!-- [4] 선물상자 화면 -->
  <section class="view" id="v-box">
    <h2 id="boxTitle"></h2>
    <p>쨘</p>
    <button class="box" id="giftBox" aria-label="선물상자 열기">
      <span class="body"></span><span class="rib"></span><span class="lid"></span>
    </button>
  </section>

  <!-- [5] 선물 확인 화면 -->
  <section class="view" id="v-gift">
    <h2 id="giftTitle"></h2>
    <img class="gift" id="giftImg" alt="생일 선물">
    <div class="row"><button class="btn" data-go="home">처음으로</button></div>
  </section>

  <!-- [추가] 예/아니오 질문 화면 (공통 틀 1개): 문구와 이동 경로는 app.js의 QUESTIONS에서 설정 -->
  <section class="view" id="v-yesno">
    <h1 id="qText"></h1>
    <p id="qSub"></p>
    <div class="row">
      <button class="btn" id="qYes"></button>
      <button class="btn mint" id="qNo"></button>
    </div>
  </section>

  <!-- [6] 개발자 로그인 -->
  <section class="view" id="v-login">
    <h2>개발자 로그인</h2>
    <div class="panel">
      <label for="loginId">이메일</label>
      <input id="loginId" type="email" autocomplete="username">
      <label for="loginPw">비밀번호</label>
      <input id="loginPw" type="password" autocomplete="current-password">
      <p class="msg" id="loginMsg" role="alert"></p>
      <div class="row"><button class="btn" id="btnLogin">로그인</button>
      <button class="btn sub" data-go="home">돌아가기</button></div>
    </div>
  </section>

  <!-- [7] 개발자: 생일자 등록/관리 -->
  <section class="view" id="v-admin">
    <h2>생일자 등록</h2>
    <div class="panel">
      <label for="admName">이름</label>
      <input id="admName">
      <label>생일 (월 / 일)</label>
      <div class="inline">
        <select id="admMonth" aria-label="월"></select>
        <select id="admDay" aria-label="일"></select>
      </div>
      <!-- [수정] 선물 이미지 입력란 삭제 → 선물 관리 화면으로 분리 -->
      <p class="msg" id="admMsg" role="alert"></p>
      <div class="row"><button class="btn" id="btnSave">등록하기</button>
      <button class="btn mint" id="btnToGifts">선물 이미지 관리</button>
      <button class="btn sub" id="btnLogout">로그아웃</button></div>
    </div>
    <h2>등록된 생일자</h2>
    <div class="panel" id="list"></div>
  </section>

  <!-- [수정] 개발자: 선물 이미지 관리 화면 (신규, 생일자 관리와 분리) -->
  <section class="view" id="v-giftadm">
    <h2>선물 이미지 관리</h2>
    <div class="panel">
      <label for="giftPerson">생일자 선택</label>
      <select id="giftPerson"></select>
      <label for="giftFile">선물 이미지</label>
      <input id="giftFile" type="file" accept="image/*">
      <p class="msg" id="giftMsg" role="alert"></p>
      <div class="row"><button class="btn" id="btnGiftSave">이미지 저장</button>
      <button class="btn sub" id="btnToPeople">생일자 관리로</button></div>
    </div>
    <h2>선물 등록 현황</h2>
    <div class="panel" id="giftList"></div>

    <!-- [추가] "생일이 아닐 때" 화면에 보여줄 사진 등록 -->
    <h2>"생일 아님" 화면 사진</h2>
    <div class="panel">
      <img class="gift" id="nbPreview" alt="" style="display:none;margin-bottom:12px">
      <label for="nbFile">사진 선택</label>
      <input id="nbFile" type="file" accept="image/*">
      <p class="msg" id="nbMsg" role="alert"></p>
      <div class="row"><button class="btn" id="btnNbSave">사진 저장</button>
      <button class="btn sub" id="btnNbDel">사진 삭제</button></div>
    </div>
  </section>

  <!-- [수정] 사용자: 본인 확인 화면 (신규, 생일 입력 후 / 선물상자 전) -->
  <section class="view" id="v-confirm">
    <h2 id="confirmTitle"></h2>
    <p>본인이 맞으면 "맞아요"를 눌러주세요.</p>
    <div class="row"><button class="btn" id="btnConfirmYes">맞아요</button>
    <button class="btn sub" id="btnConfirmNo">아니에요</button></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<!-- [수정] 인라인 <script> 블록 삭제 → app.js 파일로 분리 -->
<script src="app.js?v=6"></script>
</body>
</html>
